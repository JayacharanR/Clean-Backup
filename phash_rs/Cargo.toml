[package]
name = "phash_rs"
version = "0.1.0"
edition = "2021"
description = "Fast perceptual image hashing library with Python bindings"
license = "MIT"

[lib]
name = "phash_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
# Only the formats the app scans (see src/constants.py); the default feature
# set also builds AVIF, EXR, HDR, DDS and other codecs that are never reached.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "rayon"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
