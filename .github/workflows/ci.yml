name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint Python (ruff)
        run: |
          python -m pip install -r requirements-dev.txt
          python -m ruff check src/ main.py tests/ --output-format=github

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Lint Rust (fmt + clippy)
        working-directory: phash_rs
        run: |
          cargo fmt --check
          cargo clippy --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust module
        working-directory: phash_rs
        run: cargo test --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install ./phash_rs

      - name: Run Python tests
        run: python -m pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: clean-backup:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built application
        run: |
          docker run --detach --publish 127.0.0.1:8080:8080 --name clean-backup-ci clean-backup:ci-test
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 --max-time 5 http://127.0.0.1:8080/api/health \
            | python3 -c 'import json, sys; data = json.load(sys.stdin); assert data["ok"] and data["backend"] == "rust (phash_rs)", data'
          curl --fail http://127.0.0.1:8080/ \
            | python3 -c 'import sys; assert "<div id=\"root\"></div>" in sys.stdin.read(), "Frontend build was not served"'

      - name: Show container logs on failure
        if: failure()
        run: docker logs clean-backup-ci || true

      - name: Remove test container
        if: always()
        run: docker rm --force clean-backup-ci || true
